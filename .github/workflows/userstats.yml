name: Generate GitHub Statistics

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate statistics image
        uses: cicirello/user-statistician@v1
        with:
          colors: dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
