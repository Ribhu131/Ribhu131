
name: Generate GitHub Profile Analytics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Statistics and Languages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate GitHub Statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Ribhu131&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true
          path: images/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Ribhu131&layout=compact&langs_count=6&theme=tokyonight&hide_border=true
          path: images/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit Generated Images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/stats.svg images/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes in statistics images."
          else
            git commit -m "Update GitHub profile analytics"
            git push
          fi
